name: Security audit

on:
  pull_request:
    paths:
      - .github/workflows/security.yml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/crates/**/Cargo.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/security.yml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/crates/**/Cargo.toml
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-dependencies:
    name: Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Verify locked dependency graph
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        # The affected quick-xml versions have no untrusted XML input here.
        # tauri-winrt-notification uses 0.37.5 only for `escape::escape`, not
        # the vulnerable attribute or namespace readers. wayland-scanner uses
        # 0.39.4 at build time on protocol XML shipped by its dependency, not
        # user/network data. Keep these reachability exceptions visible until
        # both upstream paths move to quick-xml >=0.41; every other advisory
        # still fails the audit.
        run: >-
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
